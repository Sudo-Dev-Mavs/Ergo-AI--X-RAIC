[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ergoai-pose"
version = "0.1.0"
description = "Estimación local de pose para evaluación ergonómica"
requires-python = ">=3.12"
dependencies = [
  "mediapipe==1.1.1",
  "opencv-python",
  "numpy",
  "pillow",
  "pyyaml",
  "pydantic>=2",
  "pytest",
  "windnd>=1.0.7",
]

[project.scripts]
ergoai = "ergoai.cli:main"

[project.gui-scripts]
ergoai-gui = "ergoai.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/ergoai"]
