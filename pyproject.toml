[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ergoai-pose"
version = "0.2.0b1"
description = "Estimación local de pose para evaluación ergonómica"
requires-python = ">=3.12"
dependencies = [
  "mediapipe==1.1.1",
  "opencv-python",
  "numpy",
  "pillow",
  "pyyaml",
  "pydantic>=2",
  "pytest",
  "fastapi>=0.162.2",
  "uvicorn[standard]>=0.54.0",
  "python-multipart>=0.0.33",
  "httpx>=0.28.1",
]

[project.scripts]
ergoai = "ergoai.cli:main"
ergoai-gui = "ergoai.servidor:main"
ergoai-tk = "ergoai.gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/ergoai"]
artifacts = ["src/ergoai/web/dist/**"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
